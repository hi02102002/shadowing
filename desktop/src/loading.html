<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Shadowing</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fafafa;
        --fg: #18181b;
        --muted: #71717a;
        --ring: #e4e4e7;
        --accent: #18181b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #09090b;
          --fg: #fafafa;
          --muted: #a1a1aa;
          --ring: #27272a;
          --accent: #fafafa;
        }
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      main {
        display: grid;
        justify-items: center;
        gap: 16px;
      }
      h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 600;
      }
      .spinner {
        width: 28px;
        height: 28px;
        border: 3px solid var(--ring);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      #status {
        color: var(--muted);
        margin: 0;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Shadowing</h1>
      <div class="spinner"></div>
      <p id="status">Đang khởi động…</p>
    </main>
    <script>
      function setStatus(text) {
        document.getElementById('status').textContent = text
      }
    </script>
  </body>
</html>
