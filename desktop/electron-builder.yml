appId: com.github.hi02102002.shadowing
productName: Shadowing
copyright: Copyright © hi02102002

directories:
  output: dist
  buildResources: resources

# resources/icon.png (1024px, vẽ từ icon.svg) → electron-builder tự sinh .icns / .ico
files:
  - src/**/*
  - resources/icon.png
  - package.json

# app desktop không có module native, better-sqlite3 nằm trong server đã build sẵn (extraResources)
npmRebuild: false

asarUnpack:
  - node_modules/ffmpeg-static/**

# server TanStack Start (.output) + migration, chạy ngoài asar vì cần cwd thật
extraResources:
  - from: build/web
    to: web
  # whisper-cli (scripts/build-whisper.mjs), model tải lúc dùng lần đầu vào thư mục dữ liệu
  - from: build/whisper
    to: whisper
    filter:
      - whisper-cli*

mac:
  target: dmg
  category: public.app-category.education
  extendInfo:
    NSMicrophoneUsageDescription: Shadowing cần micro để ghi âm và chấm phát âm.

win:
  target: nsis

nsis:
  # không dấu cách: GitHub đổi " " thành "." khi upload → tên trong latest.yml không khớp, cập nhật lỗi 404
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - AppImage
    - deb
  category: Education
  syncDesktopName: true
  # đủ các cỡ của theme hicolor (pnpm icon), chỉ có 1024px thì menu ứng dụng không hiện icon
  icon: resources/icons
  executableName: shadowing
  # deb bắt buộc có maintainer (package.json không có email tác giả)
  maintainer: hi02102002 <hi02102002@users.noreply.github.com>

deb:
  packageName: shadowing
  # không dấu cách, giống nsis.artifactName
  artifactName: ${productName}-${version}-${arch}.${ext}

# electron-updater đọc latest*.yml từ GitHub Releases; workflow `desktop` upload các file này cùng bộ cài
publish:
  provider: github
  owner: hi02102002
  repo: shadowing
