# Build app desktop cho Linux / Windows / macOS.
# Chạy khi push tag v* (vd. v0.1.0) hoặc bấm "Run workflow" trên GitHub.
# Tag → khi cả 3 bản build xong mới tạo bản nháp GitHub Release kèm đủ file; chạy tay → tải ở mục Artifacts của run.
name: desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # latest*.yml + .blockmap: electron-updater dùng để phát hiện và tải bản mới
          - os: ubuntu-latest
            files: |
              desktop/dist/*.AppImage
              desktop/dist/*.deb
              desktop/dist/latest-linux.yml
          - os: windows-latest
            files: |
              desktop/dist/*.exe
              desktop/dist/*.exe.blockmap
              desktop/dist/latest.yml
          # macOS chưa ký → không tự cài được, app chỉ báo có bản mới
          - os: macos-latest
            files: desktop/dist/*.dmg
    runs-on: ${{ matrix.os }}
    env:
      # chưa có chứng chỉ ký → build bản không ký
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop
        shell: bash
        run: npm pkg set version="${GITHUB_REF_NAME#v}"

      - name: Build desktop
        working-directory: desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm dist --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: shadowing-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  # Tạo release một lần, sau khi cả 3 bản build xong. Nếu mỗi job tự tạo release thì các job chạy song song
  # sẽ tạo nhiều bản nháp trùng tag, file cài bị chia ra nhiều nơi.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          fail_on_unmatched_files: true
          files: dist/*
