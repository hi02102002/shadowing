# Build app desktop cho Linux / Windows / macOS.
# Chạy khi push tag v* (vd. v0.1.0) hoặc bấm "Run workflow" trên GitHub.
# Tag → khi cả 3 bản build xong mới publish GitHub Release kèm đủ file (không qua bản nháp); chạy tay → tải ở mục Artifacts của run.
name: desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # latest*.yml + .blockmap: electron-updater dùng để phát hiện và tải bản mới
          - os: ubuntu-latest
            files: |
              desktop/dist/*.AppImage
              desktop/dist/*.deb
              desktop/dist/latest-linux.yml
          - os: windows-latest
            files: |
              desktop/dist/*.exe
              desktop/dist/*.exe.blockmap
              desktop/dist/latest.yml
          # macOS chưa ký → không tự cài được, app chỉ báo có bản mới
          - os: macos-latest
            files: desktop/dist/*.dmg
    runs-on: ${{ matrix.os }}
    env:
      # chưa có chứng chỉ ký → build bản không ký
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop
        shell: bash
        run: npm pkg set version="${GITHUB_REF_NAME#v}"

      # whisper-cli build mất vài phút → cache theo nội dung script (đã chứa phiên bản + cờ build)
      - uses: actions/cache@v4
        with:
          path: desktop/build/whisper
          key: whisper-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/scripts/build-whisper.mjs') }}

      - name: Build desktop
        working-directory: desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm dist --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: shadowing-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  # Tạo release một lần, sau khi cả 3 bản build xong. Nếu mỗi job tự tạo release thì các job chạy song song
  # sẽ tạo nhiều bản nháp trùng tag, file cài bị chia ra nhiều nơi.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      # chỉ cần CHANGELOG.md để lấy ghi chú phát hành
      - uses: actions/checkout@v4
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # phần "## <phiên bản> …" của CHANGELOG.md làm nội dung release (không có thì để trống)
      - name: Release notes
        shell: bash
        run: |
          awk -v h="## ${GITHUB_REF_NAME#v}" '
            index($0, h) == 1 && (length($0) == length(h) || substr($0, length(h) + 1, 1) == " ") { on = 1; next }
            on && /^## / { exit }
            on' CHANGELOG.md > release-notes.md
          cat release-notes.md

      # publish thẳng: release nào cũng có file cài và latest*.yml cho electron-updater
      # body lấy từ CHANGELOG.md, GitHub nối thêm danh sách commit ("Full Changelog") phía sau
      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          make_latest: true
          body_path: release-notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
