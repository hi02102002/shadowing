name: quality

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  chunks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm chunks:check
      - run: pnpm exec vitest run src/lib/chunks.test.ts
      - run: pnpm build
